# Canonical labels for Outlier repositories.
# This file documents the desired label catalog.
# It can be used later with a label sync tool or GitHub script.

- name: "type: bug"
  color: "d73a4a"
  description: "Error or unexpected behavior"
- name: "type: feature"
  color: "0e8a16"
  description: "New feature or visible improvement"
- name: "type: task"
  color: "1d76db"
  description: "Technical or operational task"
- name: "type: docs"
  color: "0075ca"
  description: "Documentation work"
- name: "type: refactor"
  color: "5319e7"
  description: "Internal improvement without expected functional change"
- name: "type: chore"
  color: "cfd3d7"
  description: "Maintenance or routine configuration"
- name: "type: technical-debt"
  color: "fbca04"
  description: "Known technical debt"
- name: "type: incident"
  color: "b60205"
  description: "Operational or production incident"
- name: "type: question"
  color: "d876e3"
  description: "Question or analysis pending"

- name: "status: triage"
  color: "ededed"
  description: "Needs initial review"
- name: "status: ready"
  color: "0e8a16"
  description: "Ready to work"
- name: "status: in-progress"
  color: "1d76db"
  description: "Currently in progress"
- name: "status: blocked"
  color: "b60205"
  description: "Blocked by dependency or decision"
- name: "status: review"
  color: "5319e7"
  description: "Under review"
- name: "status: waiting-client"
  color: "fbca04"
  description: "Waiting for client or user response"
- name: "status: waiting-data"
  color: "fbca04"
  description: "Waiting for data, files or access"
- name: "status: done"
  color: "0e8a16"
  description: "Completed"

- name: "priority: p0-critical"
  color: "b60205"
  description: "Critical impact or production blocker"
- name: "priority: p1-high"
  color: "d93f0b"
  description: "High priority"
- name: "priority: p2-medium"
  color: "fbca04"
  description: "Medium priority"
- name: "priority: p3-low"
  color: "cfd3d7"
  description: "Low priority"

- name: "area: frontend"
  color: "1d76db"
  description: "Web UI or frontend"
- name: "area: backend"
  color: "0052cc"
  description: "API or backend services"
- name: "area: database"
  color: "5319e7"
  description: "Database, migrations or queries"
- name: "area: collector"
  color: "006b75"
  description: "Data collection or synchronization"
- name: "area: mobile"
  color: "bfdadc"
  description: "Mobile application"
- name: "area: infra"
  color: "5319e7"
  description: "Infrastructure, deployment or CI/CD"
- name: "area: design"
  color: "d876e3"
  description: "Design, UI or UX"
- name: "area: docs"
  color: "0075ca"
  description: "Documentation"
- name: "area: security"
  color: "b60205"
  description: "Security, auth or secrets"
- name: "area: qa"
  color: "fbca04"
  description: "Quality assurance or testing"
- name: "area: ai"
  color: "5319e7"
  description: "AI or automation"

- name: "size: xs"
  color: "c2e0c6"
  description: "Very small effort"
- name: "size: s"
  color: "c2e0c6"
  description: "Small effort"
- name: "size: m"
  color: "fbca04"
  description: "Medium effort"
- name: "size: l"
  color: "d93f0b"
  description: "Large effort"
- name: "size: xl"
  color: "b60205"
  description: "Too large; should be split"
