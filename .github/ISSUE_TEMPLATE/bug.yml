name: Bug
description: Reportar un error funcional, visual o tecnico.
title: "[Bug] "
labels: ["type: bug", "status: triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Descripcion del problema
      description: Explica que esta fallando.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Ir a ...
        2. Hacer ...
        3. Observar ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado actual
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Prioridad sugerida
      options:
        - priority: p0-critical
        - priority: p1-high
        - priority: p2-medium
        - priority: p3-low
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia
      description: Capturas, logs o referencias relevantes.
