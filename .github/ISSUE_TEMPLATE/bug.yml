name: Bug
description: Reportar un error funcional, visual o tecnico.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Usa esta plantilla para errores reproducibles. No incluyas secretos, credenciales, tokens ni informacion sensible.
  - type: input
    id: context
    attributes:
      label: Contexto
      description: Producto, modulo, cliente o repositorio afectado.
      placeholder: Ej. IMP / frontend / calendario L3
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Descripcion del problema
      description: Explica que esta fallando.
      placeholder: Describe el comportamiento observado.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      description: Indica los pasos concretos para llegar al error.
      placeholder: |
        1. Ir a ...
        2. Seleccionar ...
        3. Guardar ...
        4. Observar ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
      placeholder: Que deberia ocurrir.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado actual
      placeholder: Que ocurre actualmente.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Prioridad sugerida
      options:
        - priority: p0-critical
        - priority: p1-high
        - priority: p2-medium
        - priority: p3-low
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area principal
      options:
        - area: frontend
        - area: backend
        - area: database
        - area: collector
        - area: mobile
        - area: infra
        - area: design
        - area: qa
        - area: security
        - area: ai
        - area: docs
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia
      description: Capturas, logs sanitizados, videos o links internos.
      placeholder: Pega evidencia sin informacion sensible.
  - type: textarea
    id: notes
    attributes:
      label: Notas adicionales
      placeholder: Dependencias, restricciones, datos pendientes o contexto adicional.
