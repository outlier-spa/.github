name: Feature request
description: Solicitar una nueva funcionalidad o mejora de producto.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Usa esta plantilla cuando el cambio agrega valor funcional, mejora una experiencia de usuario o habilita un nuevo flujo.

  - type: textarea
    id: problem
    attributes:
      label: Problema u oportunidad
      description: Que problema se busca resolver o que oportunidad se quiere capturar.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Propuesta
      description: Describe la solucion esperada en terminos simples.
    validations:
      required: true

  - type: textarea
    id: users
    attributes:
      label: Usuarios o proceso afectado
      description: Quien usara esta funcionalidad y en que proceso.

  - type: dropdown
    id: priority
    attributes:
      label: Prioridad
      options:
        - p0-critical
        - p1-high
        - p2-medium
        - p3-low
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area principal
      multiple: true
      options:
        - frontend
        - backend
        - database
        - collector
        - mobile
        - infra
        - design
        - docs
        - 3d
        - qa
        - ai
        - other
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptacion
      description: Como sabremos que la funcionalidad esta terminada.
      placeholder: |
        - [ ] ...
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Restricciones o dependencias
      description: Datos, integraciones, disenos, definiciones de negocio o dependencias externas.

  - type: textarea
    id: evidence
    attributes:
      label: Referencias o evidencia
      description: Capturas, ejemplos, links, documentos o comentarios relevantes.
