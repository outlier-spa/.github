name: Bug report
description: Reportar un error reproducible o comportamiento inesperado.
title: "[Bug] "
labels: ["type: bug", "status: triage"]
body:
  - type: markdown
    attributes:
      value: |
        Usa esta plantilla para errores reproducibles. No incluyas secretos, credenciales, tokens ni informacion sensible.
  - type: input
    id: context
    attributes:
      label: Contexto
      description: Producto, modulo, cliente o repositorio afectado.
      placeholder: Ej. IMP / frontend / calendario L3
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Resumen
      description: Describe el problema en una o dos frases.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Ir a ...
        2. Seleccionar ...
        3. Observar ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado actual
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Prioridad sugerida
      options:
        - p0-critical
        - p1-high
        - p2-medium
        - p3-low
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia
      description: Capturas, logs o contexto relevante. No incluir secretos.
